<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Utsav Cart Page</title>
    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">

    <!-- Font awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
        integrity="sha384-/frq1SRXYH/bSyou/HUp/hib7RVN1TawQYja658FEOodR/FQBKVqT9Ol+Oz3Olq5" crossorigin="anonymous" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="top_header">
        <div class="container">
            <div class="text-center">
                <h3>💥 Free Registration Ends Today!💥</h3>
            </div>
        </div>
    </div>

    <section id="cartPage" class="container my-5">

        <!-- Ticket Card -->
        <div class="ticket-cards">
            <h4>Select Tickets</h4>
            <!-- Silver -->
            <div class="ticket-card d-flex justify-content-between align-items-center">
                <div>
                    <h6>Silver Package</h6>
                    <p class="mb-0 text-muted">₹ 10,000/-</p>
                </div>
                <div id="control-silver">
                    <button class="btn btn-outline-danger" onclick="addPackage('silver')">Add</button>
                </div>
            </div>

            <!-- Gold -->
            <div class="ticket-card d-flex justify-content-between align-items-center">
                <div>
                    <h6>Gold Package</h6>
                    <p class="mb-0 text-muted">₹ 20,000/-</p>
                </div>
                <div id="control-gold">
                    <button class="btn btn-outline-danger" onclick="addPackage('gold')">Add</button>
                </div>
            </div>

            <!-- Platinum -->
            <div class="ticket-card d-flex justify-content-between align-items-center">
                <div>
                    <h6>Platinum Package</h6>
                    <p class="mb-0 text-muted">₹ 30,000/-</p>
                </div>
                <div id="control-platinum">
                    <button class="btn btn-outline-danger" onclick="addPackage('platinum')">Add</button>
                </div>
            </div>

        </div>

        <!-- Footer Bar -->
        <div class="cart-footer">
            <div class="cart-footer-inner">
                <div>
                    <strong>₹<span id="totalPrice">0</span></strong>
                    <small><span id="totalCount">0</span> Packages</small>
                </div>
                <button id="proceedBtn" class="btn btn-danger px-5" disabled
                    onclick="goToUserDetails()">Proceed</button>
            </div>
        </div>

    </section>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/custom.js"></script>
</body>

</html>
