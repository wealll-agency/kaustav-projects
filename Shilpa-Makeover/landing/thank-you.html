<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Shilpa Makeover</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .thank-you-card {
            background-color: #0b0f19;
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            position: relative;
            overflow: hidden;
            margin: 20px;
        }
        .thank-you-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: #ff005c;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
        }
        .thank-you-card::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 150px;
            height: 150px;
            background: #ff005c;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: #ff005c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 0 30px rgba(255, 0, 92, 0.4);
            position: relative;
            z-index: 1;
        }
        .icon-circle svg {
            width: 40px;
            height: 40px;
            color: white;
        }
        .title {
            color: #ff005c;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }
        .subtitle {
            font-size: 18px;
            color: #e2e8f0;
            margin-bottom: 0;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="thank-you-card">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1 class="title">Thank You!</h1>
        <p class="subtitle">Thank you for booking us.</p>
    </div>
</body>
</html>
