<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendee Details</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">

    <!-- Font awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
        integrity="sha384-/frq1SRXYH/bSyou/HUp/hib7RVN1TawQYja658FEOodR/FQBKVqT9Ol+Oz3Olq5" crossorigin="anonymous" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .btn-green {
            background-color: #008a1e;
            color: #fff;
            border: none;
        }

        .btn-green:hover {
            background-color: #006e18;
            color: #fff;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="checkout-header d-flex align-items-center ">
        <div class="container">
            <!-- Back Button -->
            <div class="go_to_back">
                <button class="back-btn me-3" onclick="window.location.href='cart.html'" aria-label="Back">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h6 class="mb-0 fw-semibold">User Details</h6>
            </div>
        </div>
    </header>

    <section class="container my-5">
        <div class="card p-4">
            <h5 class="mb-4">Enter User Details</h5>
            <div id="attendee-rows">
                <!-- Rows will be added here dynamically -->
            </div>

            <div class="d-flex gap-2 mt-4">
                <button class="btn btn-green" onclick="addAttendeeRow()">Add People</button>
                <button class="btn btn-outline-danger" onclick="deleteAttendeeRow()">Delete People</button>
            </div>

            <div class="mt-5 text-end">
                <button class="btn btn-danger px-5" onclick="submitBooking()">Submit</button>
            </div>
        </div>
    </section>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/custom.js"></script>
    <script>
        $(document).ready(function () {
            initUserDetailForm();
        });
    </script>
</body>

</html>
